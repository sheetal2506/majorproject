<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vastra Vaani – Upload or Click</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      
      position: relative;

      overflow: hidden;
        background-image: url("static/background.jpg"); /* your image path */
  background-size: cover;      /* makes image full screen */
  background-position: center; /* keeps it centered */
  background-repeat: no-repeat;
  
    }

    body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.3); /* dark overlay */
  z-index: -1;
}
    .card {
  width: 100%;
  max-width: 600px;
  padding: 32px 28px 28px;
  border-radius: 28px;
  margin: auto;

  background: rgba(253, 249, 249, 0.75); /* dark glass */
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid rgba(255, 255, 255, 0.1);

  box-shadow: 0 0 40px rgba(123, 97, 255, 0.4);
}

    .title {
  text-align: center;
  font-size: 30px;
  font-weight: 700;

  background: linear-gradient(90deg, #7b61ff, #00e5ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
    .subtitle {
  text-align: center;
  font-size: 14px;
  color: #050000;
}

    .preview-box {
  border-radius: 18px;
  border: 2px dashed rgba(123, 97, 255, 0.6);
  padding: 16px;

  background: rgba(255, 255, 255, 0.05);

  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 260px;
}

    #previewImage,
    #cameraView {
      max-width: 100%;
      max-height: 340px;
      border-radius: 16px;
      object-fit: contain;
    }

    #previewPlaceholder {
      font-size: 16px;
      color: #999;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease,
        background 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
  background: linear-gradient(135deg, #fcd4ec, #faf9fc);
  color: #fff;

  box-shadow: 0 0 20px rgba(255, 205, 234, 0.8);
}

.btn-primary:hover {
  box-shadow: 0 0 30px rgb(250, 219, 246);
}

    .btn-secondary {
  background: transparent;
  color: #000607;
  border: 1px solid #000808;
}

.btn-secondary:hover {
  background: rgba(0, 229, 255, 0.1);
  box-shadow: 0 0 15px rgba(0, 6, 7, 0.884);
}

    .file-input {
      display: none;
    }

    .continue-btn {
  width: 100%;
  margin-top: 8px;

  background: #ffb6c1;   /* baby pink */
  color: #000000;        /* black text */

  padding: 14px;
  border-radius: 999px;
  border: none;

  font-size: 16px;
  font-weight: 600;

  box-shadow: 0 0 20px rgba(255, 182, 193, 0.8); /* soft pink glow */

  cursor: pointer;
  transition: all 0.2s ease;
}

.continue-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px rgba(255, 182, 193, 1);
}

   input[type="file"] {
  color: #ccc;
  margin-top: 6px;
}

    .hint {
      font-size: 12px;
      color: #080808;
      margin-top: 6px;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
        overflow-y: auto;
      }

      .card {
        padding: 24px 18px 20px;
      }

      .title {
        font-size: 24px;
      }

      .controls-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Vastra Vaani</div>
    <div class="subtitle">
      Upload or capture a clear front-facing photo to get AI-based outfit
      recommendations.
    </div>

    <div class="preview-box">
      <video id="cameraView" class="hidden" autoplay playsinline></video>
      <img id="previewImage" class="hidden" alt="Preview" />
      <div id="previewPlaceholder">No image selected</div>
    </div>

    <div class="controls-row">
      <button id="cameraBtn" class="btn btn-primary">-></button>

      <button id="uploadBtn" class="btn btn-secondary"> Upload Image</button>
      <input type="file" id="imageUpload">
    </div>

    <button id="continueBtn" class="continue-btn">Continue →</button>
    <div class="hint">
      Tip: Use a clear, front-facing photo with good lighting for better
      suggestions.
      Stand straight and avoid baggy clothes.
    </div>
  </div>

  <script>
    const cameraBtn = document.getElementById("cameraBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("imageUpload");
    const cameraView = document.getElementById("cameraView");
    const previewImage = document.getElementById("previewImage");
    const placeholder = document.getElementById("previewPlaceholder");
    const continueBtn = document.getElementById("continueBtn");

    let stream = null;
    let currentImageDataUrl = null;

    // Start / stop camera
    cameraBtn.addEventListener("click", async () => {
      // If stream exists, stop camera
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
        cameraView.classList.add("hidden");
        placeholder.classList.remove("hidden");
        previewImage.classList.add("hidden");
        cameraBtn.textContent = "🎥 Use Camera";
        return;
      }

      // Start camera
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        cameraView.srcObject = stream;
        cameraView.classList.remove("hidden");
        placeholder.classList.add("hidden");
        previewImage.classList.add("hidden");
        cameraBtn.textContent = "📸 Tap to Capture";

      } catch (err) {
        alert("Camera permission denied or not available.");
      }
    });

    // Capture frame when video is clicked
    cameraView.addEventListener("click", captureFrame);

    function captureFrame() {
  if (!stream) return;

  const canvas = document.createElement("canvas");
  canvas.width = cameraView.videoWidth;
  canvas.height = cameraView.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(cameraView, 0, 0);

  currentImageDataUrl = canvas.toDataURL("image/jpeg");

  // ✅ ADD THIS LINE
  localStorage.setItem("userPhoto", currentImageDataUrl);

  previewImage.src = currentImageDataUrl;
  previewImage.classList.remove("hidden");
  placeholder.classList.add("hidden");

  cameraView.classList.add("hidden");

  stream.getTracks().forEach((t) => t.stop());
  stream = null;

  cameraBtn.textContent = "🎥 Use Camera";
}

    // Upload from gallery
    uploadBtn.addEventListener("click", () => {
      fileInput.click();
    });

   fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = (e) => {
    currentImageDataUrl = e.target.result;

    // ✅ ADD THIS LINE
    localStorage.setItem("userPhoto", currentImageDataUrl);

    previewImage.src = currentImageDataUrl;
    previewImage.classList.remove("hidden");
    placeholder.classList.add("hidden");
    cameraView.classList.add("hidden");

    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }

    cameraBtn.textContent = "🎥 Use Camera";
  };

  reader.readAsDataURL(file);
});

    // Continue → go to next page
    continueBtn.addEventListener("click", () => {
      if (!currentImageDataUrl) {
        alert("Please upload or capture a photo first.");
        return;
      }

      try {
        localStorage.setItem("userPhoto", currentImageDataUrl);
      } catch (e) {
        console.warn("Could not save image to localStorage", e);
      }

      // Change this file name later if needed
      window.location.href = "/occasion";
    });


  </script>
</body>
</html>
