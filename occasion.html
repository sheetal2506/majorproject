<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vastra Vaani – Select Occasion</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #a66bff 0%, #5b3dc4 40%, #3b296e 100%);
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      padding: 26px 22px 22px;
    }

    .title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #4b46b5;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-bottom: 18px;
    }

    .occasion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .occasion-card {
      border-radius: 18px;
      border: 1px solid #e2e2ff;
      background: #faf8ff;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }

    .occasion-card span {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b46b5;
      margin-bottom: 4px;
    }

    .occasion-card small {
      font-size: 11px;
      color: #777;
    }

    .occasion-card.selected {
      background: #6b5bff;
      border-color: #4b46b5;
      box-shadow: 0 8px 20px rgba(109, 90, 255, 0.4);
    }

    .occasion-card.selected span,
    .occasion-card.selected small {
      color: #fff;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }

    .btn-back {
      background: #f2f2ff;
      color: #4b46b5;
      border: 1px solid #d1d1ff;
    }

    .btn-back:hover {
      background: #e7e7ff;
    }

    .btn-continue {
      flex: 1;
      min-width: 160px;
      background: linear-gradient(135deg, #6b5bff, #9d63ff);
      color: #fff;
      box-shadow: 0 8px 18px rgba(109, 90, 255, 0.35);
    }

    .btn-continue:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(109, 90, 255, 0.45);
    }

    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        overflow-y: auto;
      }
      .card {
        padding: 22px 18px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Select Occasion</div>
    <div class="subtitle">
      Tell us where you plan to wear the outfit so we can recommend the right style.
    </div>

    <div class="occasion-grid" id="occasionGrid">
      <div class="occasion-card" data-occasion="Casual">
        <span>Casual / Daily</span>
      </div>
      <div class="occasion-card" data-occasion="interview">
        <span>Office / Work</span>
      </div>
      <div class="occasion-card" data-occasion="Party">
        <span>Party</span>
      </div>
     
      

    <div class="buttons">
      <button class="btn btn-back" onclick="goBack()">← Back</button>
      <button class="btn btn-continue" onclick="goNext()">Continue →</button>
    </div>

    
  </div>

  <script>
    const cards = document.querySelectorAll(".occasion-card");
    let selectedOccasion = null;

    cards.forEach(card => {
      card.addEventListener("click", () => {
        cards.forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
        selectedOccasion = card.getAttribute("data-occasion");
      });
    });

    function goBack() {
      window.location.href = "tryon.html";
    }

    function goNext() {
      if (!selectedOccasion) {
        alert("Please select an occasion first.");
        return;
      }
      try {
        localStorage.setItem("occasion", selectedOccasion);
      } catch (e) {
        console.warn("Could not save occasion to localStorage", e);
      }

      window.location.href = "/imagestore";
    }
  </script>
</body>
</html>
